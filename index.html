<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Айракты — Аудит Яндекс</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --ok: #0f766e;
        --warn: #b91c1c;
        --line: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .wrap {
        max-width: 1200px;
        margin: 28px auto;
        padding: 0 16px;
      }
      h1, h2 { margin: 0 0 14px; }
      h1 { font-size: 30px; }
      .sub { color: var(--muted); margin-bottom: 18px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      input, button {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        font-size: 14px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        cursor: pointer;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
      .value { font-size: 24px; font-weight: 700; }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      th, td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 14px;
      }
      th { background: #f8fafc; }
      tr:last-child td { border-bottom: none; }
      .problem { background: #fff1f2; }
      .ok { color: var(--ok); font-weight: 600; }
      .bad { color: var(--warn); font-weight: 700; }
      .scroll { overflow-x: auto; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Айракты — Аудит Яндекс</h1>
      <div class="sub">Чистая single-file страница для сверки процента парка по выплатам Яндекс.</div>

      <section class="card controls">
        <input id="aDate" type="date" />
        <input id="aDriver" type="text" placeholder="Водитель" />
        <input id="aCar" type="text" placeholder="Машина" />
        <input id="aTurnover" type="number" min="0" step="100" placeholder="Оборот" />
        <input id="aActual" type="number" min="0" step="100" placeholder="Начислено парку" />
        <input id="aPercent" type="number" min="0" step="0.1" value="2" placeholder="% парка" />
        <button id="addBtn">Добавить запись</button>
      </section>

      <section class="stats">
        <div class="card"><div class="label">Общий оборот</div><div id="sTurn" class="value">—</div></div>
        <div class="card"><div class="label">Фактически начислено</div><div id="sActual" class="value">—</div></div>
        <div class="card"><div class="label">Средний факт. %</div><div id="sAvg" class="value">—</div></div>
        <div class="card"><div class="label">Недополучено</div><div id="sLost" class="value">—</div></div>
      </section>

      <h2>Детализация</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Дата</th><th>Водитель</th><th>Машина</th><th>Оборот</th><th>Начислено</th><th>% парка</th><th>Ожидаемо</th><th>Разница</th><th>Статус</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>

    <script>
      const STORE_KEY = 'airakty_audit_yandex_v1';
      const rows = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');

      const money = n => `${Math.round(n).toLocaleString('ru-RU')} ₸`;
      const pct = n => `${n.toFixed(2)}%`;
      const $ = id => document.getElementById(id);

      function save() {
        localStorage.setItem(STORE_KEY, JSON.stringify(rows));
      }

      function render() {
        const modeled = rows.map(r => {
          const expected = r.turnover * r.parkPercent / 100;
          const diff = r.actual - expected;
          return { ...r, expected, diff, status: diff < 0 ? 'Проверить' : 'OK' };
        });

        $('tbody').innerHTML = modeled.map(r => `
          <tr class="${r.diff < 0 ? 'problem' : ''}">
            <td>${r.date}</td>
            <td>${r.driver}</td>
            <td>${r.car}</td>
            <td>${money(r.turnover)}</td>
            <td>${money(r.actual)}</td>
            <td>${pct(r.parkPercent)}</td>
            <td>${money(r.expected)}</td>
            <td class="${r.diff < 0 ? 'bad' : 'ok'}">${money(r.diff)}</td>
            <td class="${r.diff < 0 ? 'bad' : 'ok'}">${r.status}</td>
          </tr>
        `).join('');

        const totalTurn = modeled.reduce((s, r) => s + r.turnover, 0);
        const totalActual = modeled.reduce((s, r) => s + r.actual, 0);
        const avg = totalTurn ? (totalActual / totalTurn) * 100 : 0;
        const lost = modeled.reduce((s, r) => s + (r.diff < 0 ? Math.abs(r.diff) : 0), 0);

        $('sTurn').textContent = money(totalTurn);
        $('sActual').textContent = money(totalActual);
        $('sAvg').textContent = pct(avg);
        $('sLost').textContent = money(lost);
      }

      $('addBtn').addEventListener('click', () => {
        const date = $('aDate').value || new Date().toISOString().slice(0, 10);
        const driver = $('aDriver').value.trim();
        const car = $('aCar').value.trim();
        const turnover = Number($('aTurnover').value) || 0;
        const actual = Number($('aActual').value) || 0;
        const parkPercent = Number($('aPercent').value) || 2;

        if (!driver || !car || turnover <= 0) return;

        rows.push({ date, driver, car, turnover, actual, parkPercent });
        save();
        render();
      });

      render();
    </script>
  </body>
</html>
